<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - PDF Compressor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {} },
            plugins: [
                tailwind.plugin(function({ addBase }) {
                    // Injecting minimal typography styles for markdown since CDN doesn't have the typography plugin built-in by default
                })
            ]
        }
    </script>
    <!-- We will load the official typography plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcf9f9; color: #1a1d25; }
        .hero-pattern { background-image: radial-gradient(#e63946 1px, transparent 1px); background-size: 20px 20px; opacity: 0.05; position: absolute; inset: 0; z-index: -1; }
    </style>
</head>
<body class="antialiased relative">
    <div class="hero-pattern"></div>
    
    <div class="max-w-4xl mx-auto px-6 py-16">
        <div class="flex items-center gap-4 mb-12">
            <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">PDF Compressor</h1>
        </div>

        <div class="bg-white rounded-2xl p-8 md:p-12 shadow-xl shadow-red-900/5 border border-red-100">
            <!-- This container will hold the rendered markdown -->
            <article id="markdown-content" class="prose prose-red lg:prose-lg max-w-none text-gray-600">
                <div class="animate-pulse flex space-x-4">
                  <div class="flex-1 space-y-4 py-1">
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="space-y-2">
                      <div class="h-4 bg-gray-200 rounded"></div>
                      <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                  </div>
                </div>
            </article>
        </div>
        
        <div class="text-center mt-12 text-gray-400 text-sm font-medium">
            &copy; 2026 PDF Compressor. Open Source.
        </div>
    </div>

    <script>
        // Fetch the markdown file and render it
        fetch('PrivacyPolicy.md')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(text => {
                document.getElementById('markdown-content').innerHTML = marked.parse(text);
            })
            .catch(error => {
                console.error('Error fetching markdown:', error);
                document.getElementById('markdown-content').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-lg">
                        <strong>Error:</strong> Could not load PrivacyPolicy.md. Make sure the file exists in the same directory.
                    </div>
                `;
            });
    </script>
</body>
</html>
